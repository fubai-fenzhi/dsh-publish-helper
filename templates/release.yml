# Copy to .github/workflows/release.yml in the package repository.
#
# Two publishing modes (pick one):
#
#   trusted (default, no long-lived token):
#     1. npm package page -> Settings -> Trusted publishing -> GitHub Actions,
#        publisher = this repository, workflow = release.yml, environment = (empty)
#     2. push a v* tag; npm exchanges the GitHub OIDC token for a short-lived credential
#
#   token (fallback):
#     add a repository secret NPM_TOKEN = granular npm token
#     (Read and write, Bypass 2FA; never commit it) and push a v* tag
#
# Granular tokens that bypass 2FA cannot unpublish and are being restricted for
# direct publishing, so prefer trusted publishing when the npm account has 2FA.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for provenance and trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Use the npm CLI that supports provenance
        run: npm install -g npm@latest

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test
        run: |
          if [ -d test ]; then
            for file in test/*.test.mjs; do
              [ -e "$file" ] || continue
              node "$file"
            done
          fi

      - name: Publish with provenance
        run: npm publish --provenance --access public --ignore-scripts
__NODE_AUTH_ENV__
