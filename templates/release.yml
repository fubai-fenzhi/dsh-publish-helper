# Copy to .github/workflows/release.yml in the package repository.
#
# Modes:
#   trusted (default): npm exchanges the GitHub OIDC token for a short-lived
#     credential; configure npm -> package -> Settings -> Trusted publishing
#     (GitHub Actions, this repository, release.yml).
#   token: inject NODE_AUTH_TOKEN from the NPM_TOKEN secret.
#
# Staged publishing (stage=true): the workflow runs `npm stage publish`; the
# package stays private until a maintainer approves it with 2FA
# (`npm stage approve <stage-id>` or the Staged Packages page on npmjs.com).
# This is how a maintainer keeps the final publish gate even when CI runs the
# build. Requires npm CLI 11.15.0+ and Node 22.14+.
#
# Maintainer-owned workflow: keep this file under branch protection / required
# reviewers for .github/workflows/ so contributors cannot change the publish
# step without review.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for provenance and trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Use the npm CLI that supports provenance and staged publish
        run: npm install -g npm@latest

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test
        run: |
          if [ -d test ]; then
            for file in test/*.test.mjs; do
              [ -e "$file" ] || continue
              node "$file"
            done
          fi

      - name: Skip publish when this version already exists
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published; skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with provenance
        if: steps.published.outputs.skip != 'true'
        run: __PUBLISH_CMD__ --provenance --access public --ignore-scripts
__NODE_AUTH_ENV__
